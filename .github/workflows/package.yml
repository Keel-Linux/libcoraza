# Build and lint this package on trixie (handbook decision 0041, first
# implementation, step 5). The check is "package / build".
#
# build: gbp buildpackage in a debian:trixie container with
# trixie-backports enabled, source and binary, the orig tarballs rebuilt
# from the pristine-tar branch. lintian then checks the .changes and any
# error or warning fails the job, as packages/build of Keel-Linux/common
# does. Nothing is signed or published; the files are kept as the
# artifact "debs".
#
# The orig tarballs, the vendor component of the Go modules included, come
# from pristine-tar, and golang-1.26-go from trixie-backports; the build
# runs upstream's C test and go test offline. This package has no
# debian/tests of its own: the library is exercised in Nginx by the
# autopkgtest of Keel-Linux/libnginx-mod-http-coraza, whose CI builds
# keel/trixie of this repository.
#
# Keel-Linux/.github's reusable build-deb.yml does not fit: it runs on the
# self-hosted keel-lxc runner, not registered yet, and neither uses gbp nor
# lints. This workflow follows Keel-Linux/common's packages.yml instead.
name: package

on:
  pull_request:
  push:
    branches: [keel/trixie]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Enable trixie-backports and install the tools
        run: |
          echo 'deb http://deb.debian.org/debian trixie-backports main' \
            > /etc/apt/sources.list.d/trixie-backports.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git git-buildpackage pristine-tar \
            devscripts equivs lintian
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Track the upstream and pristine-tar branches
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # As gbp clone does: upstream's .gitattributes must not change
          # what is exported, or the tree no longer matches the orig tarball.
          gbp setup-gitattributes
          for branch in upstream/latest pristine-tar; do
            git branch -f "$branch" "origin/$branch"
          done
      - name: Install the build dependencies
        run: |
          cd "$RUNNER_TEMP"
          mk-build-deps --install --remove \
            --tool 'apt-get -y -qq --no-install-recommends' \
            "$GITHUB_WORKSPACE/debian/control"
      - name: Build
        run: |
          gbp buildpackage --git-ignore-branch \
            --git-export-dir="$RUNNER_TEMP/build-area" \
            --git-builder='dpkg-buildpackage -us -uc'
          mkdir dist
          cp "$RUNNER_TEMP"/build-area/*.deb "$RUNNER_TEMP"/build-area/*.dsc \
            "$RUNNER_TEMP"/build-area/*.tar.* "$RUNNER_TEMP"/build-area/*.buildinfo \
            "$RUNNER_TEMP"/build-area/*.changes dist/
      - name: Lint
        run: |
          lintian --fail-on error,warning --info --display-info \
            dist/*.changes
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/
          if-no-files-found: error
